# Shown on the star-map / remote-view planet panel, like the vanilla planet
# descriptions (e.g. Vulcanus's "A hot volcanic planet with..."). Concise and
# flavorful; the full lore lives in [cindra-lore] below.
[space-location-description]
cindra=A tidally-locked world skimming its star: a molten dayside, a frozen nightside, and a thin habitable ribbon at the terminator where the factory lives. No oil and no life, only rock, ice, metal, and dangerous starlight. Power arrives in sporadic solar flares to catch or dump.

# Codex / lore flavor (planet_design.md §3). Standalone prose, keyed for a future
# discovery-codex / tips-and-tricks reader to pull in as {"cindra-lore.<key>"};
# it belongs to no single prototype, so it lives here in the locale rather than
# on any one entity. Keep these in sync with §3 of the design brief.
[cindra-lore]
discovery=Cindra orbits close enough to its star that rock runs molten across the sunward face and the air itself would boil, were there any. It is tidally locked: one hemisphere in eternal day, one in eternal night, and between them a thin band of survivable ground — the terminator — where the surface passes through every temperature at once. The dayside is a magma ocean under a sky that never moves. The nightside is a frozen vault where everything the planet ever had has snowed out and stayed. Nothing lived here long enough to leave oil or coal. Whatever you build, you build from stone, ice, and the light of a star that is always, dangerously, too close.
ribbon=The habitable band is real but narrow. Push sunward and heat kills you; push nightward and cold does. The factory lives in the seam.
flare=The star does not merely shine on Cindra — periodically it reaches out and touches the ground. A flare floods every panel with more power than the grid can hold. Caught, it is a windfall. Uncaught, it is a fire that starts in your own solar farm.
nightside=The dark side is the planet's warehouse. Water, carbonates, frozen gases — all of it locked in ice that has never seen the star. The stars overhead never move; a miner navigates by constellations that will hang in exactly the same place their whole life.
aluminium=No ore, no chemistry: Cindra tears aluminium straight out of rock and ice with nothing but electricity. It is the most power-hungry thing the planet makes, so it is the truest measure of a factory here — how much of the star's surplus you can pour through it. The light metal you ship to orbit is captured starlight, cast solid.

