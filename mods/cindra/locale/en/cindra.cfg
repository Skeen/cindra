[technology-description]
planet-discovery-cindra=Cindra orbits close enough to its star that rock runs molten across the sunward face and the air itself would boil, were there any. It is tidally locked: one hemisphere in eternal day, one in eternal night, and between them a thin band of survivable ground — the terminator — where the surface passes through every temperature at once. The dayside is a magma ocean under a sky that never moves; the nightside is a frozen vault where everything the planet ever had has snowed out and stayed. Nothing lived here long enough to leave oil or coal: whatever you build, you build from stone, ice, and the light of a star that is always, dangerously, too close.
cindra-electric-heating=An electric variant of the heating tower: it eats power instead of fuel and tops out at 600°C. On a world drowning in starlight, the cheapest heat is the surplus you were about to throw away.
cindra-lava=No lava lakes wait to be pumped here — you make it. Pour ruinous power into common stone and it runs molten, feeding the same foundries that served Vulcanus. The foundry hands stone back as it casts, so mining is only a top-up. Power, not rock, is what lava truly costs.
cindra-orbital-launch=A ground-based mass driver, a launch silo reforged for a world with no oil. It takes productivity modules and assembles each launch vehicle inside itself from raw aluminium and aluminium-powder solid fuel, plus a huge slug of power to fling it clear. The payload lands in an orbiting platform's hub like normal rocket cargo, so there is no catcher to build. Every gram of the launch is pressed from Cindra's own metal and star: petrochemical-free, from the ground up.
cindra-flare-storage=The sink web for the flare: a fast capacitor to catch the spike, a molten-salt battery to soak the plateau, and a dissipator to safely dump the rest. Nothing on Cindra survives the surplus without somewhere to put it.
cindra-science=Cindra's headline science, and one of its largest standing power draws. Distil the planet itself — signature aluminium, deep-nightside ice, ice-field calcite — into research. No oil, no biology: only this world's own fire and ice, and the star's surplus to burn.
cindra-aluminium=No aluminium ore waits to be mined — you smelt it out of rock and ice with brute electricity. Refine stone and calcite into alumina, then pour ruinous power through it in an electrolysis cell. It is the most power-hungry thing the planet makes: another place for the flare's surplus to go, and a clean, light metal to store that power and ship it to orbit.
cindra-improvised-metallurgy=Normal play carries foundries over from Vulcanus; land on Cindra with no Vulcanus behind you and you have to improvise one. Crude-liquefy the last of your bootstrap coal into lubricant, or work a silicone oil out of stone and water, and cast a rougher foundry in the field. It costs more than the one you would have imported — but it is the one you can build where you actually are.
cindra-calcite-olefins=A world with no oil still needs plastic. Split water with the star's power for hydrogen, roast calcite for its carbon, and marry the two into methanol over a copper-on-alumina catalyst; then a zeolite catalyst cracks the methanol and polymerises it straight into plastic. It is China's methanol-to-olefins route with the coal swapped for stone — the way you make hydrocarbons on a planet that never grew any.
cindra-red-mud=Refine alumina the Bayer way, with quicklime instead of acid, and it leaves iron-rich red mud. On a world with no iron ore, that waste is the ore: reduce it with the calciner's carbon dioxide in an arc furnace and win iron. It couples the two metals — every batch of Bayer alumina makes red mud you must turn to iron, and the furnace is one more ruinous draw for the flare grid to feed.

