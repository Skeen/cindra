[entity-description]
cindra-electric-heater=Turns electricity into heat, capped at 600°C. It draws power without limit and burns no fuel — the natural sink for the flare's surplus, and the way to keep the nightside from freezing, boil off water, or safely shed excess. Hotter buildings exist elsewhere; none are so happy to eat free power.

[item-name]
cindra-electric-heater=Electric heater
cindra-volatiles=Frozen volatiles

[item-description]
cindra-electric-heater=Turns electricity into heat, capped at 600°C. Draws power without limit and burns no fuel.
cindra-volatiles=Frozen gases harvested from the deep nightside, inside the cold-lethal band. A raw feedstock for local carbon chemistry.

[recipe-name]
