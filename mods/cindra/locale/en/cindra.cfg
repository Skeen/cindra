[fluid-description]
cindra-hydrogen=Split from water by the star's surplus power. The reducer that turns roasted calcite's carbon into methanol — and the reason a world with no oil can still build hydrocarbons.
cindra-oxygen=The other half of split water. Regenerates the spent zeolite catalyst and oxidises the rocket fuels; vent the surplus.
cindra-carbon-dioxide=Carbon driven out of calcite by roasting. On Cindra this is where every gram of plastic's carbon comes from — stone, not oil.
cindra-methanol=Carbon dioxide reduced by hydrogen into a liquid fuel-stock. The bridge that makes calcite's carbon usable; a zeolite catalyst cracks and polymerises it into plastic.

[item-description]
cindra-electric-heater=Turns electricity into heat, capped at 600°C. Draws power without limit and burns no fuel.
cindra-lava-manufacturer=Makes lava from stone under a huge electric draw. Fast and power-hungry, so a few feed a whole foundry line. Power, not rock, is what lava costs.
cindra-capacitor=Fast, small storage: huge flow into a tiny buffer. Catches the flare's spike; pair it with accumulators to hold the charge.
cindra-molten-salt-battery=Bulk, slow storage: a huge buffer at a trickle flow. An array soaks the flare's plateau. Must stay hot, and self-discharges when left idle.
cindra-dissipator=Draws a fixed slab of power and throws it away as heat. The flare grid's safety valve against panel overload.
cindra-mass-driver=A reskinned launch silo. Accepts productivity modules and builds each launch vehicle inside itself from raw aluminium, rocket fuel made from aluminium, and a huge slug of power. Delivers cargo to an orbiting space platform's hub via the normal rocket path, no catcher needed. Petrochemical-free.
cindra-aluminium-powder=Metallic aluminium ground ultra-fine — the reactive fuel of Cindra's ALICE propellant (ALuminium-ICE). On a world with no oil, fine metal is the fuel: the "ALICE solid rocket fuel" recipe reacts it with ice (frozen water, the oxidizer) into ordinary rocket fuel.
cindra-launch-charge=The launch vehicle, assembled inside the mass driver from raw aluminium and rocket fuel, then spent the instant it fires. You never handle it directly.
cindra-science-pack=Cindra's headline science, distilled from the planet itself — the signature aluminium, deep-nightside ice, and ice-field calcite. Petrochemical-free by nature: no oil, no coal, no biology. Slow and power-hungry to craft; research on Cindra runs on the star's surplus.
cindra-alumina=White refined feedstock for aluminium electrolysis, calcined from stone and calcite. Cheap to make; the ruinous cost comes at the next step.
cindra-aluminium=A light, clean metal smelted from alumina with brute electric power. No ore, no chemistry: just rock, ice, and the star's surplus. Cindra's biggest power sink and a high-value orbital export.
cindra-electrolysis-cell=The building that turns alumina into aluminium under a huge electric current.
cindra-quicklime=Quicklime (CaO), left behind when calcite gives up its carbon to the calciner. Feeds the zeolite catalyst; flux the surplus back into the lava melt (disposal) or vent it.
cindra-methanol-catalyst=Copper dispersed on alumina: the catalyst that reduces CO2 to methanol. It wears out slowly rather than being spent each craft, so a small stock keeps synthesis running; the spent form reprocesses back to copper and alumina.
cindra-spent-methanol-catalyst=A methanol catalyst poisoned by use. Not dead: dissolve it in acid to recover most of its copper and alumina, ready to be pressed into a fresh catalyst.
cindra-zeolite-catalyst=An aluminosilicate sieve, cooked from stone, alumina, quicklime and steam: the catalyst that cracks methanol and polymerises it into plastic. Slow-consumed; the spent form regenerates in oxygen.
cindra-spent-zeolite-catalyst=A zeolite catalyst choked with coke. Not dead: burn the coke off in oxygen and the sieve comes back to life.
cindra-red-mud=Iron-rich residue left behind when the Bayer process digests stone into alumina. Not waste yet: reduce it with carbon dioxide in an arc furnace to win iron, the metal Cindra has no ore for. It has no vent, so a Bayer line that outruns its iron furnaces will back up and stall — keep the two in step.
cindra-slag=Inert tailings, all the iron cooked out. Genuinely spent: there is nothing left to recover, so dump it before it backs up and stalls iron recovery.
cindra-arc-furnace=The building that reduces red mud to iron under a huge electric arc, using the calciner's carbon dioxide as its carbon.

