[item-description]
cindra-electric-heater=Turns electricity into heat, capped at 600°C. Draws power without limit and burns no fuel.
cindra-ice-crusher=Grinds ice into water, or water plus calcite. Pick the recipe to set the ratio.
cindra-capacitor=Fast, small storage: huge flow, tiny buffer. Catches the flare's spike; a poor long-term reservoir.
cindra-molten-salt-battery=Bulk, slow storage: huge buffer, trickle flow. Soaks the plateau across an array, but self-discharges when left idle-cold.
cindra-dissipator=Rate-limited safe power waste. The disposal floor and the panel-damage fuse.
cindra-volatiles=Frozen gases harvested from the deep nightside, inside the cold-lethal band. A raw feedstock for local carbon chemistry.
cindra-mass-driver=Ground-based electric launcher. Delivers cargo to an orbiting space platform's hub on power plus one native shell per shot — no catcher needed.
cindra-mass-driver-shell=A native-metal projectile shell, spent one per shot. Puts the recurring launch cost on local metallurgy instead of chemistry.
cindra-cryo-quench=The two-temperature quench building. Takes a hot molten fluid on one side and a cold coolant item on the other, forging cryo-hardened alloy from the shock of quenching one against the other.
cindra-cryo-coolant=A cold charge packed from raw nightside ice — the cold half of the two-temperature quench. Consumed one belt at a time to shock the molten stream into hardened alloy.
cindra-cryo-hardened-alloy=Cindra's signature export. Forged only where fire and ice meet in one machine: a hot molten stream quenched by a cold coolant charge. Neither Vulcanus (no cold) nor Aquilo (no lava) can make it.
cindra-science-pack=Cindra's headline science, distilled from the planet itself — the signature cryo-hardened alloy, deep-nightside volatiles, and ice-chain calcite. Petrochemical-free by nature: no oil, no coal, no biology. Made only in a starforge, at a ruinous cost in power.
cindra-starforge=The dedicated, power-hungry machine that crafts Cindra science. It draws far more than an ordinary assembler; running it is a deliberate flare-scale power sink.
cindra-alumina=White refined feedstock for aluminium electrolysis, calcined from stone and calcite. Cheap to make — the ruinous cost comes at the next step.
cindra-aluminium=A light, clean metal smelted from alumina with brute electric power. No ore, no chemistry: just rock, ice, and the star's surplus. Cindra's biggest power sink and a high-value orbital export.
cindra-electrolysis-cell=The building that turns alumina into aluminium under a huge electric current.

