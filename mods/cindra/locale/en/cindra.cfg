[item-description]
cindra-electric-heater=Turns electricity into heat, capped at 600°C. Draws power without limit and burns no fuel.
cindra-ice-crusher=Grinds ice into crushed-ice shards, or shards plus calcite. Pick the recipe to set the ratio. Solid in, solid out — melt the shards for water.
cindra-ice-melter=Melts crushed-ice shards into water. The fluid step of ice processing.
cindra-lava-manufacturer=Makes lava from stone under a huge electric draw. High speed, high power: a few feed a whole foundry line. Same energy per unit of lava as ever — just concentrated into fewer, hungrier machines.
cindra-crushed-ice=Ground nightside ice. Melt it for water, or feed it wherever crushed ice is called for.
cindra-capacitor=Fast, small storage: huge flow, tiny buffer. Catches the flare's spike; a poor long-term reservoir.
cindra-molten-salt-battery=Bulk, slow storage: huge buffer, trickle flow. Soaks the plateau across an array, but self-discharges when left idle-cold.
cindra-dissipator=Rate-limited safe power waste. The disposal floor and the panel-damage fuse.
cindra-volatiles=Frozen gases harvested from the deep nightside, inside the cold-lethal band. A raw feedstock for local carbon chemistry.
cindra-mass-driver=A reskinned launch silo. Delivers cargo to an orbiting space platform's hub via the normal rocket path — no catcher needed. Each launch burns an aluminium can, rocket fuel made from aluminium, and a shitton of power. Petrochemical-free.
cindra-aluminium-can=A pressed-aluminium cargo container. One is spent per launch as the shell that carries the payload to orbit — putting the recurring launch cost on local metal, not chemistry.
cindra-aluminium-powder=Metallic aluminium ground fine. The energetic base of Cindra's rocket fuel: on a world with no oil, the metal itself is the propellant. The "Solid rocket fuel" recipe turns it into ordinary rocket fuel.
cindra-launch-charge=The assembled launch payload — an aluminium can packed with rocket fuel. Built inside the mass driver and spent the instant it fires. You never handle it directly.
cindra-science-pack=Cindra's headline science, distilled from the planet itself — the signature aluminium, deep-nightside volatiles, and ice-chain calcite. Petrochemical-free by nature: no oil, no coal, no biology. Made only in a starforge, at a ruinous cost in power.
cindra-starforge=The dedicated, power-hungry machine that crafts Cindra science. It draws far more than an ordinary assembler; running it is a deliberate flare-scale power sink.
cindra-alumina=White refined feedstock for aluminium electrolysis, calcined from stone and calcite. Cheap to make — the ruinous cost comes at the next step.
cindra-aluminium=A light, clean metal smelted from alumina with brute electric power. No ore, no chemistry: just rock, ice, and the star's surplus. Cindra's biggest power sink and a high-value orbital export.
cindra-electrolysis-cell=The building that turns alumina into aluminium under a huge electric current.

