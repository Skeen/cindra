[mod-name]
cindra-start=Cindra Start

[mod-description]
cindra-start=Adds Cindra to the Any Planet Start dropdown so you can start a new game directly on Cindra.

# APS picker label for Cindra. The picker is APS's `aps-planet` string-setting;
# Factorio renders each allowed value via [string-mod-setting] <setting>-<value>,
# so without this entry the dropdown shows the raw lowercase prototype name
# "cindra" and no image. This mirrors APS's own planet labels (e.g.
# aps-planet-vulcanus=[planet=vulcanus] Vulcanus): the [planet=cindra] rich-text
# tag renders the planet prototype's icon (the real graphics/icons/cindra.png,
# wired in cindra/data-updates.lua), and "Cindra" is the capitalized name.
[string-mod-setting]
aps-planet-cindra=[planet=cindra] Cindra
