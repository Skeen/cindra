[entity-description]
cindra-electric-heater=Turns electricity into heat, up to 600°C, and burns no fuel. It draws power without limit, so it is the natural place to pour the flare's surplus: keep the nightside from freezing, boil off water, or safely shed excess power as heat.
# Worldgen resource description (ci-9l6): the ice field mines a fixed MIX.
cindra-ice=Frozen nightside ground. Mining it brings up a fixed mix of both ice and calcite at once — there is no way to pick one. Sort the two apart on the belt: ice melts to water in a chemical plant and feeds science and rocket fuel; calcite feeds the aluminium refine and the chemistry chains. Until you have sinks for both, expect one to back up and stall the drill — dump the surplus to keep the line moving.
cindra-mass-driver=A launch silo rebuilt for a world with no oil. It accepts productivity modules and assembles each launch vehicle inside itself from raw aluminium, aluminium-powder solid fuel and a huge slug of power, then flings the payload up to an orbiting space platform. Cargo lands in the platform hub like normal rocket cargo, with no catcher to build. Petrochemical-free: the whole launch is pressed from Cindra's own metal and the star's surplus.
cindra-electrolysis-cell=Pours a huge, uncapped electric current through alumina to strip out aluminium. The most power-hungry building on Cindra, built to drink the flare's surplus. Feed it alumina; take light metal, at a ruinous cost in power.
cindra-capacitor=Fast and small: enormous flow into a tiny buffer. It catches the sharp leading edge of a flare almost instantly, then fills. Use capacitors to grab the spike and accumulators to hold the charge.
cindra-molten-salt-battery=Bulk and slow: a huge buffer at a trickle flow, so an array soaks the long plateau of a flare. It must stay hot to hold charge, and slowly bleeds charge back to heat when left idle.
cindra-dissipator=Draws a fixed slab of power and throws it away as heat. The safety valve of the flare grid: its capacity is spent shedding surplus before that surplus can overload and damage a solar panel.
cindra-lava-manufacturer=Pours ruinous power into common stone until it runs molten, feeding the foundry chain that turns lava into metal. A dedicated Cindra caster, fast and power-hungry, so a few of them supply a whole metal line. Power, not rock, is what lava truly costs.
# Power diode PoC (ci-gcd, ci-8l4) — a one-way conduit between two electric networks.
cindra-power-diode=A one-way power valve, wired like a power switch. Connect the source network to one side and the sink network to the other; power flows one way, source to sink, up to a fixed rate, and never back. Use it to let a fast capacitor bank dump into a bulk battery bank without the battery bleeding back when it is fuller.
cindra-arc-furnace=Reduces red mud to iron with carbon dioxide under a huge, uncapped electric arc. One of the largest continuous power draws on the planet, built to drink the flare's surplus like the electrolysis cell. Feed it red mud and the calciner's carbon dioxide; take iron and inert slag, at a heavy cost in power.

