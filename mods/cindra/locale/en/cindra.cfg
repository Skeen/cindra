[mod-setting-description]
cindra-ribbon-orientation=Which way the habitable band runs, and therefore which axis carries the hot-cold gradient. Vertical: the band runs north-south, hot to the west. Horizontal: the band runs east-west, hot to the north.
cindra-ribbon-max-dps=Peak environmental damage per second on a lethal (hot-lava / smooth-ice) tile.
cindra-zone-width-hot-ocean=Width in tiles of the sunward hot-lava OCEAN, the hottest lethal edge (an impassable molten sea that reads as going on forever).
cindra-zone-width-hot-inner=Width in tiles of the hot inner slope, the damaging lava/cracks-hot rings radiating out of the lava ocean.
cindra-zone-width-hot-outer=Width in tiles of the hot outer slope, the cooling cracked/smooth volcanic rock blending into the habitable middle.
cindra-zone-width-middle=Width in tiles of the wide habitable MIDDLE (ash + soil) where the factory is built.
cindra-zone-width-cold-outer=Width in tiles of the cold outer slope, the cooling dust blending into the habitable middle.
cindra-zone-width-cold-inner=Width in tiles of the cold inner slope, the damaging snow/rough-ice rings radiating out of the ice ocean.
cindra-zone-width-cold-ocean=Width in tiles of the nightward smooth-ice OCEAN, the coldest lethal edge (a frozen sea you can run on but which freezes you).

