[mod-setting-name]
aps-planet=Starting planet
aps-safe-orbit=Safe orbit
aps-vulcanus-fulgora=Enable Vulcanus-Fulgora space connection
aps-vulcanus-rock-multiplier=Vulcanus rock resource multiplier

[mod-setting-description]
aps-safe-orbit=Swaps the asteroid size between Nauvis' orbit and the starting planet's, making Nauvis more dangerous and the starting planet safe.\nOnly applies when vanilla Space Age planets are selected.
aps-vulcanus-fulgora=Enables a space conenction between Vulcanus and Fulgora when starting on either planet, that way researching Nauvis or Gleba first isn't required.\nOnly applies when either planet is selected.
aps-vulcanus-rock-multiplier=Multiplies the mining results of Vulcanus rocks, which can help speed up the early game resource drought and mid game tungsten drought.\nOnly applies when Vulcanus is selected.

[string-mod-setting]
aps-planet-none=None
aps-planet-nauvis=[planet=nauvis] Nauvis
aps-planet-vulcanus=[planet=vulcanus] Vulcanus
aps-planet-gleba=[planet=gleba] Gleba
aps-planet-fulgora=[planet=fulgora] Fulgora
aps-planet-aquilo=[planet=aquilo] Aquilo

[any-planet-start]
none-selected=No starting planet selected. If this was unintended, please change the mod setting from the main menu.
start-new-game=Does not work in an existing game, please start a new world for the mod to work.
mod-setting-changed=Changing the planet mid-save doesn't work, and you may experience softlocks. Please start a new world if you want to start from a different planet.