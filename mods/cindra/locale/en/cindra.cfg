[mod-name]
cindra=Cindra — The Ribbon World

[mod-description]
cindra=A tidally-locked planet orbiting perilously close to its star. A molten dayside, a frozen nightside, and a narrow survivable ribbon at the terminator where the factory lives. Survival is routing the star's surplus between fire and ice.

