[mod-name]
cindra=Cindra — The Ribbon World

[mod-description]
cindra=A tidally-locked planet orbiting perilously close to its star. A molten dayside, a frozen nightside, and a narrow survivable ribbon at the terminator where the factory lives. Survival is routing the star's surplus between fire and ice.

[space-location-name]
cindra=Cindra

[technology-name]
planet-discovery-cindra=Cindra
cindra-electric-heating=Electric heating

[technology-description]
planet-discovery-cindra=Cindra orbits close enough to its star that rock runs molten across the sunward face. It is tidally locked: one hemisphere in eternal day, one in eternal night, and between them a thin band of survivable ground — the terminator — where the surface passes through every temperature at once.
cindra-electric-heating=An electric variant of the heating tower: it eats power instead of fuel and tops out at 600°C. On a world drowning in starlight, the cheapest heat is the surplus you were about to throw away.

[mod-setting-name]
cindra-ribbon-safe-half-width=Ribbon: safe band half-width
cindra-ribbon-lethal-at=Ribbon: lethal-edge distance
cindra-ribbon-wall-at=Ribbon: hard-wall distance
cindra-ribbon-max-dps=Ribbon: peak edge damage/second

[mod-setting-description]
cindra-ribbon-safe-half-width=Tiles from the ribbon centre that stay temperate (no environmental damage).
cindra-ribbon-lethal-at=Tiles from centre at which heat (sunward) / cold (nightward) damage reaches its maximum.
cindra-ribbon-wall-at=Tiles from centre of the impassable backstop bounding the playable ribbon.
cindra-ribbon-max-dps=Peak environmental damage per second at the lethal edge.

# Entity / item / recipe names accrue below as Cindra is built out.

[entity-name]
cindra-electric-heater=Electric heater

[entity-description]
cindra-electric-heater=Turns electricity into heat, capped at 600°C. It draws power without limit and burns no fuel — the natural sink for the flare's surplus, and the way to keep the nightside from freezing, boil off water, or safely shed excess. Hotter buildings exist elsewhere; none are so happy to eat free power.

