[technology-description]
planet-discovery-cindra=Cindra orbits close enough to its star that rock runs molten across the sunward face and the air itself would boil, were there any. It is tidally locked: one hemisphere in eternal day, one in eternal night, and between them a thin band of survivable ground — the terminator — where the surface passes through every temperature at once. The dayside is a magma ocean under a sky that never moves; the nightside is a frozen vault where everything the planet ever had has snowed out and stayed. Nothing lived here long enough to leave oil or coal: whatever you build, you build from stone, ice, and the light of a star that is always, dangerously, too close.
cindra-electric-heating=An electric variant of the heating tower: it eats power instead of fuel and tops out at 600°C. On a world drowning in starlight, the cheapest heat is the surplus you were about to throw away.
cindra-ice-processing=Grind the nightside's ice into the water the factory runs on. A ground-bound cousin of the space crusher: feed it ice, take water — or trade some of that water for calcite. The ratio is yours to pick.
cindra-lava=No lava lakes wait to be pumped here — you make it. Pour ruinous power into common stone and it runs molten, feeding the same foundries that served Vulcanus. The foundry hands stone back as it casts, so mining is only a top-up. Power, not rock, is what lava truly costs.
cindra-orbital-launch=A ground-based mass driver flings cargo to a platform catcher on nothing but a charged electric buffer and a native-metal shell. No rocket fuel, no chemistry: on Cindra the only thing a launch costs is power you already had, spent in one bright burst.

