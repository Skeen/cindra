[entity-description]
cindra-electric-heater=Turns electricity into heat, capped at 600°C. It draws power without limit and burns no fuel — the natural sink for the flare's surplus, and the way to keep the nightside from freezing, boil off water, or safely shed excess. Hotter buildings exist elsewhere; none are so happy to eat free power.
cindra-ice-crusher=Grinds nightside ice into crushed-ice shards — or, with the other recipe, shards and calcite. A ground-standing cousin of the space-platform crusher, adapted for Cindra's gravity. It is a grinder, not a boiler: it emits no water. Melt the shards for that.
cindra-ice-melter=Melts crushed-ice shards into water under applied heat. The second half of ice processing: the crusher makes the shards, the melter makes the fluid. Where the phase change actually happens.
cindra-mass-driver=A launch silo rebuilt for a world with no oil. It packs cargo into an aluminium can, burns aluminium-powder solid fuel and a huge slug of power to build each launch, then flings the payload up to an orbiting space platform. Cargo lands in the platform hub like normal rocket cargo — no catcher to build. Petrochemical-free: the whole launch is pressed from Cindra's own metal and the star's surplus.
cindra-electrolysis-cell=Pours a huge, uncapped electric current through alumina to strip out aluminium. The most power-hungry building on Cindra — a sink built for the flare's surplus. Feed it alumina; take light metal, at the cost of ruinous power.
cindra-capacitor=Fast and small: enormous flow, a tiny buffer. It catches the sharp leading edge of a flare almost instantly, then fills. A spike catcher, not a reservoir — a plain accumulator holds far more.
cindra-molten-salt-battery=Bulk and slow: a huge buffer at a trickle flow, so an array soaks the flare's plateau. It must stay hot — left idle it bleeds charge to heat upkeep — which makes it a mild sink here and awkward anywhere colder.
cindra-dissipator=Rate-limited safe waste. It draws a fixed slab of power and throws it away as heat. It is the disposal floor and the sacrificial fuse: its capacity is spent before the flare's surplus is ever allowed to touch a panel.
cindra-starforge=The dedicated engine of Cindra research: it grinds the planet's own materials into science under a ruinous electric draw. It eats far more power than any ordinary assembler — an array of them is a flare-scale load, which is exactly the point. Power is the resource; here it is spent to learn.
cindra-lava-manufacturer=Pours ruinous power into common stone until it runs molten. A dedicated Cindra caster: far faster and far hungrier than a foundry, so a handful of them feed a whole metal chain instead of a hundred tiny machines — but the power bill per unit of lava is unchanged. Fewer buildings, same ruinous draw.

