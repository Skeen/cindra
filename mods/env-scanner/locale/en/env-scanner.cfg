[entity-description]
environmental-scanner=Reads the local surface and broadcasts it to the circuit network: day/night cycle position, daylight fraction, tick-of-day, and current solar output. On Cindra it also forecasts incoming solar flares (countdown, phase, intensity). Wire it up to automate against the sky.

[item-description]
environmental-scanner=A circuit-network hub that broadcasts the surface's day/night and solar readings. Forecasts solar flares where a flare rhythm exists.

[virtual-signal-name]
env-daytime=Day/night position (permille)
env-daylight=Daylight fraction (percent)
env-solar=Solar output (percent)
env-tick-of-day=Tick of day
env-flare-countdown=Flare countdown (ticks)
env-flare-phase=Flare phase (code)
env-flare-intensity=Flare intensity (percent)
