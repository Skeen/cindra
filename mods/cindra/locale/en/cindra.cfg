[entity-description]
cindra-electric-heater=Turns electricity into heat, capped at 600°C. It draws power without limit and burns no fuel — the natural sink for the flare's surplus, and the way to keep the nightside from freezing, boil off water, or safely shed excess. Hotter buildings exist elsewhere; none are so happy to eat free power.
cindra-ice-crusher=Grinds nightside ice into water — or, with the other recipe, water and calcite. A ground-standing cousin of the space-platform crusher, adapted for Cindra's gravity and fitted with a water tap.
cindra-mass-driver=Loads cargo and native shells, charges a heavy electric buffer from the grid, then flings a shot to an orbital catcher in one burst. Costs power and one shell per shot; no rocket fuel, no chemistry. Bursty by nature: it must recharge before it can fire again.
cindra-mass-driver-catcher=The orbital end of the launch pair. Built once on a space platform, it receives whatever the ground-side mass driver throws up to it.

