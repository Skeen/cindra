[item-description]
cindra-electric-heater=Turns electricity into heat, capped at 600°C. Draws power without limit and burns no fuel.
cindra-ice-crusher=Grinds ice into crushed-ice shards, or shards plus calcite. Pick the recipe to set the ratio. It only crushes; melt the shards for water.
cindra-ice-melter=Melts crushed-ice shards into water. The fluid step of ice processing.
cindra-lava-manufacturer=Makes lava from stone under a huge electric draw. Fast and power-hungry, so a few feed a whole foundry line. Power, not rock, is what lava costs.
cindra-crushed-ice=Ground nightside ice. Melt it for water, or feed it wherever crushed ice is called for.
cindra-capacitor=Fast, small storage: huge flow into a tiny buffer. Catches the flare's spike; pair it with accumulators to hold the charge.
cindra-molten-salt-battery=Bulk, slow storage: a huge buffer at a trickle flow. An array soaks the flare's plateau. Must stay hot, and self-discharges when left idle.
cindra-dissipator=Draws a fixed slab of power and throws it away as heat. The flare grid's safety valve against panel overload.
cindra-volatiles=Frozen gases harvested from the deep nightside, inside the cold-lethal band. A raw feedstock for local carbon chemistry.
cindra-mass-driver=A ground launch silo for a world with no oil. Delivers cargo to an orbiting space platform's hub by the normal rocket path, with no catcher needed. Each launch burns an aluminium can, aluminium-powder solid fuel, and a huge slug of power. Petrochemical-free.
cindra-aluminium-can=A pressed-aluminium cargo container. One is spent per launch as the shell that carries the payload to orbit — putting the recurring launch cost on local metal, not chemistry.
cindra-aluminium-powder=Metallic aluminium ground fine. The energetic base of Cindra's solid rocket fuel: on a world with no oil, the metal itself is the propellant.
cindra-solid-rocket-fuel=Solid propellant packed from aluminium powder. Burns hot enough to launch, made from nothing but Cindra's own metal — no oil, no coal, no chemistry.
cindra-launch-charge=The assembled launch payload — an aluminium can packed with solid fuel. Built inside the mass driver and spent the instant it fires. You never handle it directly.
cindra-science-pack=Cindra's headline science, distilled from the planet itself — the signature aluminium, deep-nightside volatiles, and ice-chain calcite. Petrochemical-free by nature: no oil, no coal, no biology. Slow and power-hungry to craft; research on Cindra runs on the star's surplus.
cindra-alumina=White refined feedstock for aluminium electrolysis, calcined from stone and calcite. Cheap to make; the ruinous cost comes at the next step.
cindra-aluminium=A light, clean metal smelted from alumina with brute electric power. No ore, no chemistry: just rock, ice, and the star's surplus. Cindra's biggest power sink and a high-value orbital export.
cindra-electrolysis-cell=The building that turns alumina into aluminium under a huge electric current.

