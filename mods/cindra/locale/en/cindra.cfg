[recipe-description]
cindra-crude-lubricant=Crude-liquefy coal into lubricant. Just enough, from the finite bootstrap coal, to build your first foundry — there is no coal to mine, so this can never be your supply.
cindra-mineral-lubricant=Work a silicone oil out of common stone and water. Petrochemical-free and renewable, but heavy on stone and power — the local, sustainable way to keep lubricant flowing once the bootstrap coal is gone.
cindra-field-foundry=Cast a foundry in the field, without Vulcanus's pressure or its oil. Rougher and costlier than the one you would import — the escape hatch for a start with no foundries to carry over.
