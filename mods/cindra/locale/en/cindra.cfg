[item-description]
cindra-electric-heater=Turns electricity into heat, capped at 600°C. Draws power without limit and burns no fuel.
cindra-ice-crusher=Grinds ice into water, or water plus calcite. Pick the recipe to set the ratio.
cindra-volatiles=Frozen gases harvested from the deep nightside, inside the cold-lethal band. A raw feedstock for local carbon chemistry.
cindra-mass-driver=Ground-based electric launcher. Delivers cargo to an orbital catcher on power plus one native shell per shot.
cindra-mass-driver-catcher=One-time orbital structure that catches a mass driver's payload on a space platform.
cindra-mass-driver-shell=A native-metal projectile shell, spent one per shot. Puts the recurring launch cost on local metallurgy instead of chemistry.

