[mod-setting-description]
cindra-ribbon-orientation=Which way the habitable band runs, and therefore which axis carries the hot-cold gradient. Vertical: the band runs north-south, hot to the west. Horizontal: the band runs east-west, hot to the south.
cindra-ribbon-safe-half-width=Tiles from the habitable-band centre that stay temperate (no environmental damage).
cindra-ribbon-lethal-at=Tiles from centre at which heat (sunward) / cold (nightward) damage reaches its maximum.
cindra-ribbon-wall-at=Tiles from centre to the world edge (void) bounding the playable band.
cindra-ribbon-max-dps=Peak environmental damage per second on a lethal (lava / deep-ice) tile.
cindra-nightside-freeze-temp=Axis temperature at/below which unheated nightside machines take cold damage.

