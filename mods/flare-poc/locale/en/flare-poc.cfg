# Flare PoC entity locale. The PoC's entities are clones with fresh prototype
# names (scripts/config.lua), so without these entries they render the raw key
# (e.g. "flare-solar-panel") when placed from the editor for a playtest. Names
# only; no items or recipes exist (entities are spawned directly by tests).
# The guard cindra/unit-tests/test_locale_mods.lua enumerates config.lua and
# fails if any of these entity names loses its locale entry.
[entity-name]
flare-solar-panel=Flare solar panel
flare-capacitor=Capacitor
flare-molten-salt-battery=Molten-salt battery
flare-dissipator=Dissipator
flare-measurement-sink=Measurement sink

[entity-description]
flare-solar-panel=High-output solar panel whose power swings from a dim baseline to a ~100x flare peak with the daylight cycle. Degrades when the grid cannot absorb its surplus.
flare-capacitor=Fast, small storage: huge flow into a tiny buffer. Catches the sharp leading edge of a flare.
flare-molten-salt-battery=Bulk, slow storage: a huge buffer at a trickle flow. Soaks the sustained flare plateau, and slowly self-discharges when left idle.
flare-dissipator=Draws a fixed slab of power and throws it away as heat. The disposal floor and sacrificial fuse of the flare grid.
flare-measurement-sink=Test rig that absorbs a panel's full output without throttling, so a test can read the real engine solar output.
