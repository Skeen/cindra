[recipe-description]
cindra-solid-rocket-fuel=ALICE propellant: react nano-aluminium powder with ice (frozen water) and oxygen into ordinary rocket fuel. Fine metal burns as the fuel, ice and oxygen are the oxidiser — Cindra's petrochemical-free route to rocket fuel, drawing on the aluminium chain, the nightside ice, and the surplus oxygen the electrolysis line floods out.
cindra-crude-lubricant=Crude-liquefy coal into lubricant. Just enough, from the finite bootstrap coal, to build your first foundry — there is no coal to mine, so this can never be your supply.
cindra-mineral-lubricant=Work a silicone oil out of common stone and water. Petrochemical-free and renewable, but heavy on stone and power — the local, sustainable way to keep lubricant flowing once the bootstrap coal is gone.
cindra-field-foundry=Cast a foundry in the field, without Vulcanus's pressure or its oil. Rougher and costlier than the one you would import — the escape hatch for a start with no foundries to carry over.
cindra-vent-oxygen=Release surplus oxygen to the sky. The electrolysis that frees hydrogen makes twice as much oxygen as the plastic chain can use; this keeps it from backing up and stalling the line.
cindra-vent-quicklime=Dump surplus quicklime that calcination leaves behind. The emergency drain that keeps calcination from clogging when the disposal and zeolite sinks are backed up.
cindra-vent-co2=Release surplus carbon dioxide to the sky. If methanol synthesis lags the CO2 that calcination frees, this drains it so calcination never stalls.
cindra-quicklime-disposal=Flux surplus quicklime back into the lava melt. Consumes far more lava than the stone it returns, so it is a true sink — never a way to mint free stone.
cindra-methanol-synthesis=Reduce roasted-calcite CO2 with electrolysis hydrogen into methanol, over a copper-on-alumina catalyst. The bridge that makes calcite's carbon usable; hands back water and returns the catalyst nearly intact.
cindra-methanol-rocket-fuel=Burn methanol against surplus oxygen to make ordinary rocket fuel. The second thing methanol is good for, and a heavy oxygen sink: it drinks the oxygen the electrolysis line floods out. The fuel is for launching and export, worth far less energy than the methanol and power sunk into it.
cindra-methanol-catalyst=Press copper onto alumina into the catalyst that drives methanol synthesis. Slow-consumed, so a small stock keeps the line running.
cindra-methanol-catalyst-reprocessing=Dissolve a spent methanol catalyst in acid to recover most of its copper and alumina — the loop that keeps the catalyst from ever becoming a dead item.
cindra-mto-polymerisation=Crack methanol over a zeolite catalyst and polymerise it straight into plastic. Cindra's petrochemical-free plastic, made from stone carbon; hands back water and returns the catalyst nearly intact.
cindra-zeolite-catalyst=Cook stone, alumina, quicklime and steam into a zeolite sieve — the catalyst that turns methanol into plastic, and the real consumer of the calciner's quicklime.
cindra-zeolite-catalyst-regeneration=Burn the coke off a spent zeolite catalyst in oxygen and it comes back to life — a real oxygen sink and the loop that keeps the zeolite from ever dying.
cindra-bayer-alumina=Digest stone into alumina with quicklime, the way the Bayer process refines bauxite. No acid needed — only the quicklime the calciner already frees — but it is thirstier for stone and leaves iron-rich red mud you must then reduce to iron. The other way to make alumina; both feed the same electrolysis.
cindra-iron-recovery=Reduce red mud with carbon dioxide under ruinous power into iron and inert slag. Cindra has no iron ore, so this waste is the ore: the red mud from refining alumina becomes the planet's iron. A heavy carbon-dioxide sink that closes the calciner's loop, and a heavy power draw that belongs on the flare grid.
cindra-arc-furnace=Build the high-draw arc furnace that reduces red mud to iron.
cindra-vent-slag=Dump inert slag that iron recovery leaves behind. The emergency drain that keeps a full slag box from stalling the furnace; there is nothing of value left in it.

# Runtime messages (flying text, alerts).
[cindra-message]
no-paving=Cindra's terrain cannot be paved over.
